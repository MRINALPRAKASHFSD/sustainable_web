<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KRMU</title>
    <link rel="stylesheet" href="styles.css">

    <script type="module">
      // 1. Import Firebase Functions
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

      // 2. YOUR CONFIGURATION
      const firebaseConfig = {
        apiKey: "AIzaSyCcrmSuKbwTsUOigbZu_maCQmvf4HQ8ia4",
        authDomain: "krmu-impact-bf09e.firebaseapp.com",
        projectId: "krmu-impact-bf09e",
        storageBucket: "krmu-impact-bf09e.firebasestorage.app",
        messagingSenderId: "676855708371",
        appId: "1:676855708371:web:6e5ca271427a61312df226",
        measurementId: "G-2ZHP3D9F8F",
        databaseURL: "https://krmu-impact-bf09e-default-rtdb.firebaseio.com"
      };

      // 3. Initialize App
      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      // 4. Make Database Global for script.js
      window.db = db;
      window.dbRef = ref;
      window.dbPush = push;
      window.dbOnValue = onValue;
      
      console.log("🔥 Firebase Connected Successfully!");
      window.dispatchEvent(new Event('firebase-ready'));
    </script>
</head>
<body>
    <div class="video-bg-container">
        <video autoplay loop muted playsinline class="back-video">
            <source src="background.mp4" type="video/mp4">
        </video>
    </div>
    <div class="video-overlay"></div>

    <nav class="navbar">
        <div class="brand">KRMU <span class="glow-brand">GREEN</span></div>
        <a href="dashboard.html" class="glow-btn">View Stats</a>
    </nav>

    <div class="main-container">
        <div class="glass-panel" style="max-width: 450px; text-align: left;">
            <div style="text-align:center; margin-bottom: 2rem;">
                <h2 class="neon-text" style="font-size: 2.5rem;">Student Login</h2>
                <p style="color:#aaa; font-size: 0.9rem; margin-top: 5px;">Access the Sustainability Portal</p>
            </div>
            
            <form id="loginForm">
                <div style="margin-bottom: 1.5rem;">
                    <label style="color:var(--primary); font-family: var(--font-head); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 1px;">Roll Number</label>
                    <input type="text" id="roll" placeholder="Ex: 21005678" style="width:100%; padding:15px; border-radius:8px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:white;" required autocomplete="off">
                </div>
                <div style="margin-bottom: 2rem;">
                    <label style="color:var(--primary); font-family: var(--font-head); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 1px;">Password</label>
                    <input type="password" id="pass" placeholder="••••••••" style="width:100%; padding:15px; border-radius:8px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:white;" required>
                </div>
                <button type="submit" class="glow-btn" style="width:100%; text-align:center; cursor:pointer;">Login & Start</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
