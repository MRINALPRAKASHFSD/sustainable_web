<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to KRMU Green - Student Environmental Initiative Portal">
    <title>Login - KRMU Green</title>

    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/components.css">

    <style>
        /* Page-specific styles */
        .auth-layout__video {
            opacity: 0;
            transition: opacity 1s ease-out;
        }

        .auth-layout__video.loaded {
            opacity: 1;
        }

        /* Poster fallback for low-power devices */
        .auth-layout__bg--static {
            background: linear-gradient(135deg, hsl(240 10% 8%) 0%, hsl(240 10% 4%) 100%);
        }
    </style>
</head>

<body>
    <!-- Background with video (performance optimized) -->
    <div class="auth-layout__bg auth-layout__bg--static">
        <video id="bgVideo" class="auth-layout__video" autoplay loop muted playsinline
            poster="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1' /%3E"
            aria-hidden="true">
            <source src="green-forest-moewalls-com.mp4" type="video/mp4">
        </video>
    </div>
    <div class="auth-layout__overlay"></div>

    <!-- Header -->
    <header class="auth-header">
        <a href="/" class="auth-header__brand">
            KRMU <span class="auth-header__brand-accent">GREEN</span>
        </a>
        <a href="dashboard.html" class="btn btn--ghost btn--sm">View Stats</a>
    </header>

    <!-- Main Content -->
    <main class="auth-layout">
        <div class="auth-layout__card">
            <div class="card">

                <!-- Step Indicator -->
                <div class="card__header">
                    <div class="steps" role="navigation" aria-label="Login progress">
                        <div class="steps__dot steps__dot--active" id="stepDot1" aria-current="step"></div>
                        <div class="steps__dot" id="stepDot2"></div>
                    </div>
                </div>

                <!-- Step 1: Enter Roll Number -->
                <div id="step1" class="step step--active">
                    <div class="card__header text-center">
                        <h1 class="card__title">Welcome back</h1>
                        <p class="card__description">Enter your roll number to receive a verification code</p>
                    </div>

                    <div class="card__content">
                        <form id="requestOtpForm" class="form" novalidate>
                            <div class="field">
                                <label for="rollNumber" class="label">Roll Number</label>
                                <div class="input-group">
                                    <input type="text" id="rollNumber" class="input" placeholder="e.g. 21005678"
                                        autocomplete="username" autocapitalize="none" spellcheck="false"
                                        inputmode="text" aria-describedby="rollHelp rollError" required>
                                    <span class="input-group__suffix">@krmu.edu.in</span>
                                </div>
                                <span id="rollHelp" class="help">We'll send a 6-digit code to your university
                                    email</span>
                                <div id="rollError" class="error" role="alert" aria-live="polite"></div>
                            </div>

                            <button type="submit" id="sendOtpBtn" class="btn btn--primary btn--full">
                                Send verification code
                            </button>
                        </form>
                    </div>

                    <div class="card__footer">
                        <p class="text-sm text-muted">
                            Don't have an account? <a href="register.html">Register</a>
                        </p>
                    </div>
                </div>

                <!-- Step 2: Verify OTP -->
                <div id="step2" class="step">
                    <div class="card__header text-center">
                        <h1 class="card__title">Check your email</h1>
                        <p class="card__description">
                            We sent a 6-digit code to<br>
                            <span id="sentToEmail" class="email-preview mt-2"></span>
                        </p>
                    </div>

                    <div class="card__content">
                        <form id="verifyOtpForm" class="form" novalidate>
                            <div class="field">
                                <label class="label sr-only">Verification code</label>
                                <div id="otpInput" class="otp-input" role="group"
                                    aria-label="6-digit verification code">
                                    <!-- OTP inputs injected by JS -->
                                </div>
                                <div id="otpError" class="error text-center" role="alert" aria-live="polite"></div>
                                <div id="otpSuccess" class="help text-center" style="color: hsl(var(--primary));"
                                    aria-live="polite"></div>
                            </div>

                            <button type="submit" id="verifyOtpBtn" class="btn btn--primary btn--full">
                                Verify &amp; Login
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <button type="button" id="resendOtpBtn" class="btn btn--ghost btn--sm" disabled>
                                Resend code
                            </button>
                        </div>
                    </div>

                    <div class="card__footer justify-center">
                        <button type="button" id="backToStep1" class="btn btn--link text-sm">
                            ← Use a different roll number
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Toast container -->
    <div id="toast" class="toast" role="status" aria-live="polite">
        <div class="toast__title"></div>
        <div class="toast__message"></div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script>
        // ========== Video Performance Optimization ==========
        (function () {
            const video = document.getElementById('bgVideo');
            if (!video) return;

            // Check for reduced motion preference
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            // Check for low-power device (rough heuristic)
            const isLowPower = navigator.hardwareConcurrency <= 2 ||
                navigator.deviceMemory < 4 ||
                /Android.*Chrome\/[.0-9]* Mobile/.test(navigator.userAgent);

            // Check connection type
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            const isSlowConnection = connection && (connection.saveData || connection.effectiveType === '2g' || connection.effectiveType === 'slow-2g');

            if (prefersReducedMotion || isSlowConnection) {
                video.remove();
            } else if (isLowPower) {
                // On low-power devices, pause video after initial load
                video.addEventListener('loadeddata', () => {
                    video.classList.add('loaded');
                    setTimeout(() => video.pause(), 5000);
                }, { once: true });
            } else {
                video.addEventListener('loadeddata', () => {
                    video.classList.add('loaded');
                }, { once: true });
            }
        })();

        // ========== Login Flow ==========
        let loginEmail = '';
        let loginRoll = '';

        const elements = {
            step1: document.getElementById('step1'),
            step2: document.getElementById('step2'),
            stepDot1: document.getElementById('stepDot1'),
            stepDot2: document.getElementById('stepDot2'),
            rollNumber: document.getElementById('rollNumber'),
            rollError: document.getElementById('rollError'),
            sendOtpBtn: document.getElementById('sendOtpBtn'),
            sentToEmail: document.getElementById('sentToEmail'),
            otpInput: document.getElementById('otpInput'),
            otpError: document.getElementById('otpError'),
            otpSuccess: document.getElementById('otpSuccess'),
            verifyOtpBtn: document.getElementById('verifyOtpBtn'),
            resendOtpBtn: document.getElementById('resendOtpBtn'),
            backToStep1: document.getElementById('backToStep1')
        };

        // Debounce helper
        function debounce(fn, delay) {
            let timeout;
            return (...args) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => fn(...args), delay);
            };
        }

        // Show step
        function showStep(stepNum) {
            elements.step1.classList.toggle('step--active', stepNum === 1);
            elements.step2.classList.toggle('step--active', stepNum === 2);
            elements.stepDot1.classList.toggle('steps__dot--active', stepNum === 1);
            elements.stepDot1.classList.toggle('steps__dot--completed', stepNum === 2);
            elements.stepDot2.classList.toggle('steps__dot--active', stepNum === 2);

            if (stepNum === 1) {
                elements.stepDot1.setAttribute('aria-current', 'step');
                elements.stepDot2.removeAttribute('aria-current');
            } else {
                elements.stepDot2.setAttribute('aria-current', 'step');
                elements.stepDot1.removeAttribute('aria-current');
            }
        }

        // Validate roll number with debounce
        const validateRoll = debounce((value) => {
            const isValid = /^[a-zA-Z0-9]{5,15}$/.test(value);
            elements.rollNumber.classList.toggle('input--error', value && !isValid);
            if (value && !isValid) {
                elements.rollError.textContent = 'Roll number must be 5-15 alphanumeric characters';
            } else {
                elements.rollError.textContent = '';
            }
        }, 300);

        elements.rollNumber.addEventListener('input', (e) => {
            validateRoll(e.target.value.trim());
        });

        // Step 1: Request OTP
        document.getElementById('requestOtpForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const roll = elements.rollNumber.value.trim();

            if (!/^[a-zA-Z0-9]{5,15}$/.test(roll)) {
                elements.rollError.textContent = 'Roll number must be 5-15 alphanumeric characters';
                elements.rollNumber.classList.add('input--error');
                elements.rollNumber.focus();
                return;
            }

            elements.rollError.textContent = '';
            elements.rollNumber.classList.remove('input--error');
            auth.setLoading('sendOtpBtn', true);

            loginRoll = roll.toLowerCase();
            loginEmail = `${loginRoll}@krmu.edu.in`;

            const result = await auth.requestOTP(roll, 'login');
            auth.setLoading('sendOtpBtn', false);

            if (result.success) {
                elements.sentToEmail.textContent = loginEmail;
                auth.setupOTPInput('otpInput');
                auth.startResendTimer('resendOtpBtn', 30);
                showStep(2);
                // Focus first OTP input
                setTimeout(() => {
                    const firstInput = elements.otpInput.querySelector('.otp-input__digit');
                    if (firstInput) firstInput.focus();
                }, 100);
            } else {
                elements.rollError.textContent = result.message || 'Failed to send verification code';
            }
        });

        // Step 2: Verify OTP
        document.getElementById('verifyOtpForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const otp = auth.getOTPValue('otpInput');

            if (otp.length !== 6) {
                elements.otpError.textContent = 'Please enter all 6 digits';
                return;
            }

            elements.otpError.textContent = '';
            auth.setLoading('verifyOtpBtn', true);

            const result = await auth.verifyOTP(loginEmail, otp, 'login');
            auth.setLoading('verifyOtpBtn', false);

            if (result.success) {
                elements.otpSuccess.textContent = 'Login successful! Redirecting...';
                auth.clearResendTimer();
                setTimeout(() => {
                    window.location.href = 'form.html';
                }, 1000);
            } else {
                elements.otpError.textContent = result.message || 'Verification failed';
                auth.clearOTPInput('otpInput');
            }
        });

        // Resend OTP
        elements.resendOtpBtn.addEventListener('click', async () => {
            elements.otpError.textContent = '';
            elements.otpSuccess.textContent = '';

            const result = await auth.requestOTP(loginRoll, 'login');

            if (result.success) {
                auth.startResendTimer('resendOtpBtn', 30);
                auth.clearOTPInput('otpInput');
                elements.otpSuccess.textContent = 'New code sent!';
                setTimeout(() => { elements.otpSuccess.textContent = ''; }, 3000);
            } else {
                elements.otpError.textContent = result.message;
            }
        });

        // Back to step 1
        elements.backToStep1.addEventListener('click', () => {
            auth.clearResendTimer();
            elements.otpError.textContent = '';
            elements.otpSuccess.textContent = '';
            showStep(1);
            elements.rollNumber.focus();
        });

        // Check if already logged in
        auth.checkAuth().then(result => {
            if (result.success) {
                window.location.href = 'form.html';
            }
        });
    </script>
</body>

</html>
