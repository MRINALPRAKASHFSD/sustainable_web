<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for KRMU Green - Student Environmental Initiative Portal">
    <meta name="theme-color" content="#0a0a0c">
    <title>Register - KRMU Green</title>

    <!-- Prevent flash of wrong theme -->
    <script>
        (function () {
            const theme = localStorage.getItem('krmu-theme') || 'system';
            const resolved = theme === 'system'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : theme;
            document.documentElement.dataset.theme = resolved;
            document.querySelector('meta[name="theme-color"]')?.setAttribute('content', resolved === 'dark' ? '#0a0a0c' : '#ffffff');
        })();
    </script>

    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/liquid-glass.css">

    <style>
        /* Page-specific styles */
        .auth-layout__video {
            opacity: 0;
            transition: opacity 1s ease-out;
        }

        .auth-layout__video.loaded {
            opacity: 1;
        }

        .auth-layout__bg--static {
            background: linear-gradient(135deg, hsl(240 10% 8%) 0%, hsl(240 10% 4%) 100%);
        }
    </style>
</head>

</head>

<body>
    <!-- Skip link for accessibility -->
    <a href="#main" class="skip-link">Skip to content</a>

    <!-- Background with video (performance optimized) -->
    <div class="auth-layout__bg auth-layout__bg--static">
        <video id="bgVideo" class="auth-layout__video" autoplay loop muted playsinline
            poster="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1' /%3E"
            aria-hidden="true">
            <source src="background.mp4" type="video/mp4">
        </video>
    </div>
    <div class="auth-layout__overlay"></div>

    <!-- Header -->
    <header class="auth-header">
        <a href="login.html" class="auth-header__brand">
            KRMU <span class="auth-header__brand-accent">GREEN</span>
        </a>
        <nav class="site-header__nav">
            <div id="themeToggle"></div>
            <a href="login.html" class="btn btn--ghost btn--sm">Sign in</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="auth-layout">
        <div class="auth-layout__card">
            <div class="card glass glass--accent">
                <!-- Glass overlays -->
                <div class="glass__shine"></div>
                <div class="glass__noise" aria-hidden="true"></div>

                <!-- Step Indicator -->
                <div class="card__header">
                    <div class="steps" role="navigation" aria-label="Registration progress">
                        <div class="steps__dot steps__dot--active" id="stepDot1" aria-current="step"></div>
                        <div class="steps__dot" id="stepDot2"></div>
                    </div>
                </div>

                <!-- Step 1: Registration Details -->
                <div id="step1" class="step step--active">
                    <div class="card__header text-center">
                        <h1 class="card__title">Create an account</h1>
                        <p class="card__description">Join KRMU Green and make a difference</p>
                    </div>

                    <div class="card__content">
                        <form id="registerForm" class="form" novalidate>
                            <!-- Roll Number -->
                            <div class="field">
                                <label for="rollNumber" class="label label--required">Roll Number</label>
                                <input type="text" id="rollNumber" class="input" placeholder="e.g. 21005678"
                                    autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="text"
                                    aria-describedby="rollHelp" required>
                                <span id="rollHelp" class="help">Your university roll number</span>
                            </div>

                            <!-- Email Preview -->
                            <div class="field">
                                <label class="label">University Email</label>
                                <div id="emailPreview" class="email-preview"
                                    style="width: 100%; justify-content: center;">
                                    Enter roll number above
                                </div>
                            </div>

                            <!-- Full Name -->
                            <div class="field">
                                <label for="fullName" class="label label--required">Full Name</label>
                                <input type="text" id="fullName" class="input" placeholder="Enter your full name"
                                    autocomplete="name" spellcheck="false" aria-describedby="nameHelp" required>
                                <span id="nameHelp" class="help">As it appears on your university ID</span>
                            </div>

                            <!-- Phone (Optional) -->
                            <div class="field">
                                <label for="phone" class="label">Phone <span
                                        class="text-muted">(optional)</span></label>
                                <input type="tel" id="phone" class="input" placeholder="+91 9876543210"
                                    autocomplete="tel" inputmode="tel">
                            </div>

                            <div id="step1Error" class="error" role="alert" aria-live="polite"></div>

                            <button type="submit" id="sendOtpBtn" class="btn btn--primary btn--full">
                                Continue with email verification
                            </button>
                        </form>
                    </div>

                    <div class="card__footer">
                        <p class="text-sm text-muted">
                            Already have an account? <a href="login.html">Sign in</a>
                        </p>
                    </div>
                </div>

                <!-- Step 2: Verify OTP -->
                <div id="step2" class="step">
                    <div class="card__header text-center">
                        <h1 class="card__title">Verify your email</h1>
                        <p class="card__description">
                            Enter the 6-digit code sent to<br>
                            <span id="sentToEmail" class="email-preview mt-2"></span>
                        </p>
                    </div>

                    <div class="card__content">
                        <form id="verifyOtpForm" class="form" novalidate>
                            <div class="field">
                                <label class="label sr-only">Verification code</label>
                                <div id="otpInput" class="otp-input" role="group"
                                    aria-label="6-digit verification code">
                                    <!-- OTP inputs injected by JS -->
                                </div>
                                <div id="otpError" class="error text-center" role="alert" aria-live="polite"></div>
                                <div id="otpSuccess" class="help text-center" style="color: hsl(var(--primary));"
                                    aria-live="polite"></div>
                            </div>

                            <button type="submit" id="verifyOtpBtn" class="btn btn--primary btn--full">
                                Verify &amp; Create Account
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <button type="button" id="resendOtpBtn" class="btn btn--ghost btn--sm" disabled>
                                Resend code
                            </button>
                        </div>
                    </div>

                    <div class="card__footer justify-center">
                        <button type="button" id="backToStep1" class="btn btn--link text-sm">
                            ← Change details
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Toast container -->
    <div id="toast" class="toast" role="status" aria-live="polite">
        <div class="toast__title"></div>
        <div class="toast__message"></div>
    </div>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // ========== Video Performance Optimization ==========
        (function () {
            const video = document.getElementById('bgVideo');
            if (!video) return;

            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const isLowPower = navigator.hardwareConcurrency <= 2 ||
                navigator.deviceMemory < 4 ||
                /Android.*Chrome\/[.0-9]* Mobile/.test(navigator.userAgent);
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            const isSlowConnection = connection && (connection.saveData || connection.effectiveType === '2g' || connection.effectiveType === 'slow-2g');

            if (prefersReducedMotion || isSlowConnection) {
                video.remove();
            } else if (isLowPower) {
                video.addEventListener('loadeddata', () => {
                    video.classList.add('loaded');
                    setTimeout(() => video.pause(), 5000);
                }, { once: true });
            } else {
                video.addEventListener('loadeddata', () => {
                    video.classList.add('loaded');
                }, { once: true });
            }
        })();

        // ========== Registration Flow ==========
        let registrationData = {};

        const elements = {
            step1: document.getElementById('step1'),
            step2: document.getElementById('step2'),
            stepDot1: document.getElementById('stepDot1'),
            stepDot2: document.getElementById('stepDot2'),
            rollNumber: document.getElementById('rollNumber'),
            emailPreview: document.getElementById('emailPreview'),
            fullName: document.getElementById('fullName'),
            phone: document.getElementById('phone'),
            step1Error: document.getElementById('step1Error'),
            sendOtpBtn: document.getElementById('sendOtpBtn'),
            sentToEmail: document.getElementById('sentToEmail'),
            otpInput: document.getElementById('otpInput'),
            otpError: document.getElementById('otpError'),
            otpSuccess: document.getElementById('otpSuccess'),
            verifyOtpBtn: document.getElementById('verifyOtpBtn'),
            resendOtpBtn: document.getElementById('resendOtpBtn'),
            backToStep1: document.getElementById('backToStep1')
        };

        // Debounce helper
        function debounce(fn, delay) {
            let timeout;
            return (...args) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => fn(...args), delay);
            };
        }

        // Show step
        function showStep(stepNum) {
            elements.step1.classList.toggle('step--active', stepNum === 1);
            elements.step2.classList.toggle('step--active', stepNum === 2);
            elements.stepDot1.classList.toggle('steps__dot--active', stepNum === 1);
            elements.stepDot1.classList.toggle('steps__dot--completed', stepNum === 2);
            elements.stepDot2.classList.toggle('steps__dot--active', stepNum === 2);

            if (stepNum === 1) {
                elements.stepDot1.setAttribute('aria-current', 'step');
                elements.stepDot2.removeAttribute('aria-current');
            } else {
                elements.stepDot2.setAttribute('aria-current', 'step');
                elements.stepDot1.removeAttribute('aria-current');
            }
        }

        // Update email preview with debounce
        const updateEmailPreview = debounce((value) => {
            const roll = value.trim().toLowerCase();
            if (/^[a-z0-9]{3,}$/i.test(roll)) {
                elements.emailPreview.textContent = `${roll}@krmu.edu.in`;
                elements.emailPreview.style.color = '';
            } else {
                elements.emailPreview.textContent = 'Enter valid roll number';
                elements.emailPreview.style.color = 'hsl(var(--muted-foreground))';
            }
        }, 150);

        elements.rollNumber.addEventListener('input', (e) => {
            updateEmailPreview(e.target.value);
        });

        // Step 1: Submit registration form
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const roll = elements.rollNumber.value.trim();
            const name = elements.fullName.value.trim();
            const phone = elements.phone.value.trim();

            // Validation
            if (!/^[a-zA-Z0-9]{5,15}$/.test(roll)) {
                elements.step1Error.textContent = 'Roll number must be 5-15 alphanumeric characters';
                elements.rollNumber.focus();
                return;
            }

            if (name.length < 2) {
                elements.step1Error.textContent = 'Please enter your full name';
                elements.fullName.focus();
                return;
            }

            elements.step1Error.textContent = '';
            auth.setLoading('sendOtpBtn', true);

            // Store registration data
            registrationData = {
                rollNumber: roll.toLowerCase(),
                name: name,
                phone: phone,
                email: `${roll.toLowerCase()}@krmu.edu.in`
            };

            const result = await auth.requestOTP(roll, 'register');
            auth.setLoading('sendOtpBtn', false);

            if (result.success) {
                elements.sentToEmail.textContent = registrationData.email;
                auth.setupOTPInput('otpInput');
                auth.startResendTimer('resendOtpBtn', 30);
                showStep(2);
                // Focus first OTP input
                setTimeout(() => {
                    const firstInput = elements.otpInput.querySelector('.otp-input__digit');
                    if (firstInput) firstInput.focus();
                }, 100);
            } else {
                elements.step1Error.textContent = result.message || 'Failed to send verification code';
            }
        });

        // Step 2: Verify OTP
        document.getElementById('verifyOtpForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const otp = auth.getOTPValue('otpInput');

            if (otp.length !== 6) {
                elements.otpError.textContent = 'Please enter all 6 digits';
                return;
            }

            elements.otpError.textContent = '';
            auth.setLoading('verifyOtpBtn', true);

            const result = await auth.verifyOTP(
                registrationData.email,
                otp,
                'register',
                registrationData
            );

            auth.setLoading('verifyOtpBtn', false);

            if (result.success) {
                elements.otpSuccess.textContent = 'Account created! Redirecting...';
                auth.clearResendTimer();
                setTimeout(() => {
                    window.location.href = 'form.html';
                }, 1500);
            } else {
                elements.otpError.textContent = result.message || 'Verification failed';
                auth.clearOTPInput('otpInput');
            }
        });

        // Resend OTP
        elements.resendOtpBtn.addEventListener('click', async () => {
            elements.otpError.textContent = '';
            elements.otpSuccess.textContent = '';

            const result = await auth.requestOTP(registrationData.rollNumber, 'register');

            if (result.success) {
                auth.startResendTimer('resendOtpBtn', 30);
                auth.clearOTPInput('otpInput');
                elements.otpSuccess.textContent = 'New code sent!';
                setTimeout(() => { elements.otpSuccess.textContent = ''; }, 3000);
            } else {
                elements.otpError.textContent = result.message;
            }
        });

        // Back to step 1
        elements.backToStep1.addEventListener('click', () => {
            auth.clearResendTimer();
            elements.otpError.textContent = '';
            elements.otpSuccess.textContent = '';
            showStep(1);
            elements.rollNumber.focus();
        });

        // Check if already logged in
        auth.checkAuth().then(result => {
            if (result.success) {
                window.location.href = 'form.html';
            }
        });
    </script>

    <!-- Theme system -->
    <script type="module">
        import { createThemeToggle } from './js/theme.js';
        const toggleContainer = document.getElementById('themeToggle');
        if (toggleContainer) createThemeToggle(toggleContainer);
    </script>

    <!-- Glass shine effect -->
    <script type="module" src="js/glass-shine.js"></script>
</body>

</html>
